<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spellbook Row Actions — Component Preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<!-- Design tokens the controls depend on -->
<link rel="stylesheet" href="tokens.css" />
<!-- The three controls' styles -->
<link rel="stylesheet" href="controls.css" />
<!-- Material Symbols — REQUIRED for the Star Orbit cast control -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 30px; margin: 0 0 4px; }
  .sub { color: var(--ink-faint); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 28px; }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 32px 0 4px; }
  .note { color: var(--ink-muted); font-size: 13px; line-height: 1.5; margin: 0 0 14px; max-width: 60ch; }

  /* a minimal spell row to host the controls, mimicking the app table */
  .row-frame { background: var(--surface-1); border: 1px solid var(--border-soft); border-radius: var(--radius-md); overflow: visible; }
  .row-frame .spell-row + .spell-row { border-top: 1px solid var(--border-soft); }
  .spell-row { display: grid; grid-template-columns: 3rem 1fr auto; align-items: stretch; min-height: 2.75rem; }
  .action-cell { display: flex; align-items: center; justify-content: center; position: relative; overflow: visible;
    border-right: 1px solid var(--border-soft); background: linear-gradient(90deg, transparent, oklch(0 0 0 / 0.08)); }
  .spell-row:first-child .action-cell { border-top-left-radius: var(--radius-md); }
  .spell-row:last-child .action-cell { border-bottom-left-radius: var(--radius-md); }
  .name-cell { display: flex; flex-direction: column; justify-content: center; padding: 8px 12px; gap: 2px; }
  .name { font-family: var(--font-display); font-size: 17px; line-height: 1.1; }
  .school-cell { display: flex; align-items: center; padding: 0 16px; font-family: var(--font-mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-faint); border-left: 1px solid var(--border-soft); }
  .controls-line { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 0; }
  /* Star Orbit is ~49px — taller than a default 44px row — so its rows get more height */
  .spell-row.tall { min-height: 4rem; }
</style>
</head>
<body class="theme-dark accent-brass">
<div class="wrap">
  <h1>Spellbook Row Actions</h1>
  <div class="sub">Component preview · Learn / Prepare / Cast</div>
  <p class="note">Switch the <code>&lt;body&gt;</code> class to e.g. <code>theme-light accent-crimson</code> to check other palettes. Each control tracks <code>--accent</code>.</p>
  <div id="root"></div>
</div>

<script type="text/babel" data-presets="react">
const { useState } = React;

/* ---- 1. LEARN — Sliding Tab ---- */
function LearnTab({ learned = false, disabled = false, onClick }) {
  return (
    <button type="button"
      className={'tab-learn' + (learned ? ' is-learned' : '') + (disabled ? ' is-disabled' : '')}
      aria-pressed={learned} aria-label={learned ? 'Unlearn spell' : 'Learn spell'}
      disabled={disabled} onClick={onClick}>
      <span className="tab-shape" />
      <span className="tab-glyph">{learned ? '✓' : '+'}</span>
      <span className="dog-ear" aria-hidden>
        <svg width="9" height="9" viewBox="0 0 9 9">
          <path d="M0 0 L9 0 L9 9 Z" fill="var(--bg-elev)" stroke="var(--accent-strong)" strokeWidth="0.7" />
          <path d="M0 0 L9 9" stroke="var(--accent-strong)" strokeWidth="0.6" />
        </svg>
      </span>
    </button>
  );
}

/* ---- 2. PREPARE — Fused Stepper (max 9) ---- */
function FusedStepper({ value = 0, min = 0, max = 9, disabled = false, onChange }) {
  const dec = () => !disabled && value > min && onChange?.(value - 1);
  const inc = () => !disabled && value < max && onChange?.(value + 1);
  return (
    <div className={'fused-stepper' + (disabled ? ' is-disabled' : '')}>
      <button type="button" onClick={dec} disabled={value <= min} aria-label="Prepare one less">−</button>
      <span className="num">{value}</span>
      <button type="button" onClick={inc} disabled={value >= max} aria-label="Prepare one more">+</button>
    </div>
  );
}

/* ---- 3. CAST — Star Orbit (max 9, turns only on cast) ---- */
function StarOrbitCast({ remaining = 0, total = 3, onClick }) {
  const empty = remaining <= 0;
  const n = Math.min(Math.max(remaining, 0), 9);
  const [casting, setCasting] = useState(false);
  const handleClick = (e) => {
    if (empty) return;
    setCasting(true);
    setTimeout(() => setCasting(false), 340);
    onClick?.(e);
  };
  return (
    <button type="button"
      className={'orbit-cast' + (empty ? ' is-empty' : '') + (casting ? ' casting' : '')}
      aria-label={empty ? 'No slots remaining' : `Cast spell (${remaining} of ${total} left)`}
      disabled={empty} onClick={handleClick} style={{ ['--star-count']: n || 1 }}>
      <span className="orbit-path" aria-hidden />
      <span className="ring" aria-hidden>
        {Array.from({ length: n }).map((_, i) => (
          <span key={i} className="star" style={{ ['--a']: `${(360 / n) * i}deg` }}>
            <span className="material-symbols-outlined">star</span>
          </span>
        ))}
      </span>
      <span className="orbit-num">{remaining}</span>
    </button>
  );
}

/* ---- demo harness ---- */
function Row({ children, name, school, tall }) {
  return (
    <div className={'spell-row' + (tall ? ' tall' : '')}>
      <div className="action-cell">{children}</div>
      <div className="name-cell"><div className="name">{name}</div></div>
      <div className="school-cell">{school}</div>
    </div>
  );
}

function Demo() {
  const [learnedA, setLearnedA] = useState(false);
  const [learnedB, setLearnedB] = useState(true);
  const [prep, setPrep] = useState(2);
  const [castA, setCastA] = useState(9);
  const [castB, setCastB] = useState(3);

  return (
    <div>
      <h2>1 · Learn — Sliding Tab</h2>
      <p className="note">Toggle. Not learned = tucked in; click and the tab's tip slides OUT to the left. Click again to retract.</p>
      <div className="row-frame">
        <Row name="Magic Missile" school="Evocation"><LearnTab learned={learnedA} onClick={() => setLearnedA(v => !v)} /></Row>
        <Row name="Shield" school="Abjuration"><LearnTab learned={learnedB} onClick={() => setLearnedB(v => !v)} /></Row>
        <Row name="Detect Magic" school="Divination"><LearnTab disabled /></Row>
      </div>

      <h2>2 · Prepare — Fused Stepper (max 9)</h2>
      <p className="note">−/value/+ fused into one pill. − disables at 0, + disables at 9.</p>
      <div className="row-frame">
        <Row name="Magic Missile" school="Evocation"><FusedStepper value={prep} onChange={setPrep} /></Row>
        <Row name="Sleep" school="Enchantment"><FusedStepper value={0} onChange={()=>{}} /></Row>
        <Row name="Identify" school="Divination"><FusedStepper value={9} onChange={()=>{}} /></Row>
      </div>

      <h2>3 · Cast — Star Orbit (max 9, turns only on cast)</h2>
      <p className="note">Stars sit still; each tap spends a slot, removes a star, and the ring turns one brief step. Disabled at 0.</p>
      <div className="row-frame">
        <Row tall name="Magic Missile" school="Evocation"><StarOrbitCast remaining={castA} total={9} onClick={() => setCastA(v => Math.max(0, v - 1))} /></Row>
        <Row tall name="Shield" school="Abjuration"><StarOrbitCast remaining={castB} total={3} onClick={() => setCastB(v => Math.max(0, v - 1))} /></Row>
        <Row tall name="Sleep" school="Enchantment"><StarOrbitCast remaining={0} total={3} /></Row>
      </div>
    </div>
  );
}

const __mount = () => ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
// Wait for Material Symbols to finish loading so every star glyph is shaped
// (avoids a brief "star" ligature-text flash on first paint).
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(__mount);
} else {
  __mount();
}
</script>
</body>
</html>
