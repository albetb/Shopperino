<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopperino — Redesign</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app.css" />

  <style>
    html, body { margin: 0; padding: 0; background: #0c0b09; }
    body { font-family: "Manrope", system-ui, sans-serif; color: #f0e9dd; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="ds.jsx"></script>
  <script type="text/babel" src="screens-mobile.jsx"></script>
  <script type="text/babel" src="screens-responsive.jsx"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
  const ShopDS = window.DesignSystem;
  const ShopM  = window.MobileScreens;
  const ShopR  = window.ResponsiveScreens;

  // Theme wrapper used inside every artboard so tokens scope correctly.
  function Themed({ theme = "dark", accent = "crimson", children, style }) {
    return (
      <div className={`sh-root theme-${theme} accent-${accent}`} style={style}>
        {children}
      </div>
    );
  }

  // shorthand to make a phone artboard
  const phone  = (id, label, Comp, props = {}) => (
    <DCArtboard id={id} label={label} width={390} height={844} background="var(--bg)">
      <Themed>
        <Comp {...props} />
      </Themed>
    </DCArtboard>
  );

  // accent / theme variant of combat
  const combatVariant = (id, label, theme, accent) => (
    <DCArtboard id={id} label={label} width={390} height={844} background="var(--bg)">
      <Themed theme={theme} accent={accent}>
        <ShopM.ScreenCombat />
      </Themed>
    </DCArtboard>
  );

  function App() {
    return (
      <DesignCanvas
        title="Shopperino · Redesign"
        subtitle="Token system → atoms → mobile screens → responsive → theming proofs"
        defaultBg="var(--bg)"
      >

        {/* ============================================================
            01 · DESIGN SYSTEM (tokens + atoms + molecules)
            One wide artboard, source of truth.
           ============================================================ */}
        <DCSection id="ds" title="01 · Design System" subtitle="Tokens, atoms and molecules — the source of truth">
          <DCArtboard id="ds-1280" label="Foundations + atoms + molecules" width={1280} height={3400} background="var(--bg)">
            <Themed>
              <ShopDS />
            </Themed>
          </DCArtboard>
        </DCSection>

        {/* ============================================================
            02 · MOBILE — six top-level tabs (390 × 844)
           ============================================================ */}
        <DCSection id="tabs" title="02 · Mobile — six tabs" subtitle="Primary target: 390 × 844 (iPhone 14 / Pixel-class). Tap targets ≥ 44 px.">
          {phone("home-master",   "Home · master mode",  ShopM.ScreenHome, { master: true })}
          {phone("home-player",   "Home · player mode",  ShopM.ScreenHome, { master: false })}
          {phone("shop",          "Shop (master)",       ShopM.ScreenShop, { drawerOpen: false })}
          {phone("spellbook",     "Spellbook",           ShopM.ScreenSpellbook)}
          {phone("loot",          "Loot (master)",       ShopM.ScreenLoot)}
          {phone("search",        "Search",              ShopM.ScreenSearch)}
        </DCSection>

        {/* ============================================================
            03 · MOBILE — Player Sheet sub-pages (7)
           ============================================================ */}
        <DCSection id="sheet-sub" title="03 · Mobile — Player Sheet sub-pages" subtitle="Bottom-nav-driven. Thumb-zone primary actions; active indicator drives off --accent.">
          {phone("ps-combat",    "Combat",    ShopM.ScreenCombat)}
          {phone("ps-inventory", "Inventory", ShopM.ScreenInventory)}
          {phone("ps-skills",    "Skills",    ShopM.ScreenSkills)}
          {phone("ps-feats",     "Feats",     ShopM.ScreenFeats)}
          {phone("ps-features",  "Features",  ShopM.ScreenFeatures)}
          {phone("ps-spells",    "Spells",    ShopM.ScreenSpells)}
          {phone("ps-notes",     "Notes",     ShopM.ScreenNotes)}
        </DCSection>

        {/* ============================================================
            04 · MOBILE — chrome states (drawer, sheet, modal)
           ============================================================ */}
        <DCSection id="chrome" title="04 · Mobile — chrome states" subtitle="Drawer (sidebar) · bottom sheet (accent picker) · modal (feat choice)">
          {phone("drawer", "Sidebar drawer",        ShopM.ScreenSheetDrawer)}
          {phone("sheet",  "Accent picker · sheet", ShopM.ScreenAccentSheet)}
          {phone("modal",  "Feat choice · modal",   ShopM.ScreenFeatModal)}
        </DCSection>

        {/* ============================================================
            05 · RESPONSIVE — tablet (768) + desktop (1280)
           ============================================================ */}
        <DCSection id="responsive" title="05 · Responsive — tablet & desktop" subtitle="Layouts evolve from drawer-over-content to persistent sidebar + horizontal tab bar.">
          <DCArtboard id="d-home" label="Desktop · Home (1280)" width={1280} height={800} background="var(--bg)">
            <Themed><ShopR.DesktopHome /></Themed>
          </DCArtboard>
          <DCArtboard id="d-combat" label="Desktop · Combat (1280)" width={1280} height={800} background="var(--bg)">
            <Themed><ShopR.DesktopCombat /></Themed>
          </DCArtboard>
          <DCArtboard id="d-inv" label="Desktop · Inventory (1280)" width={1280} height={800} background="var(--bg)">
            <Themed><ShopR.DesktopInventory /></Themed>
          </DCArtboard>
          <DCArtboard id="d-search" label="Desktop · Search (1280)" width={1280} height={800} background="var(--bg)">
            <Themed><ShopR.DesktopSearch /></Themed>
          </DCArtboard>
          <DCArtboard id="d-shop" label="Desktop · Shop (1280)" width={1280} height={800} background="var(--bg)">
            <Themed><ShopR.DesktopShop /></Themed>
          </DCArtboard>
          <DCArtboard id="t-combat" label="Tablet · Combat (768)" width={768} height={1000} background="var(--bg)">
            <Themed><ShopR.TabletCombat /></Themed>
          </DCArtboard>
        </DCSection>

        {/* ============================================================
            06 · ACCENT THEMING — Combat in 3 accents side-by-side
           ============================================================ */}
        <DCSection id="accents" title="06 · Theming — three accents, one component" subtitle="Same Combat page, only --accent and its 5 derivatives change. Borders, focus, slots, selected rows, buttons all re-skin.">
          {combatVariant("a-crimson", "Crimson  · accent-crimson", "dark", "crimson")}
          {combatVariant("a-emerald", "Emerald · accent-emerald", "dark", "emerald")}
          {combatVariant("a-royal",   "Royal   · accent-royal",   "dark", "royal")}
          {combatVariant("a-brass",   "Brass   · accent-brass",   "dark", "brass")}
          {combatVariant("a-violet",  "Violet  · accent-violet",  "dark", "violet")}
        </DCSection>

        {/* ============================================================
            07 · MODES — Dark vs Light (parchment)
           ============================================================ */}
        <DCSection id="modes" title="07 · Modes — dark vs parchment" subtitle="theme-dark (default) and theme-light. Same component, same accent, ink inverts intentionally.">
          {combatVariant("m-dark",  "Dark · ink + candlelight",   "dark",  "crimson")}
          {combatVariant("m-light", "Light · parchment + ink",    "light", "crimson")}
          {combatVariant("m-dark-r",  "Dark · royal accent",      "dark",  "royal")}
          {combatVariant("m-light-r", "Light · royal accent",     "light", "royal")}
        </DCSection>

      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
